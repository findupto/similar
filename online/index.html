<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MK Pizza — Order Online</title><style>body{margin:0;font:15px system-ui;background:#f7f8fc;color:#172033}header{padding:22px;background:#111827;color:white;position:sticky;top:0;z-index:2}main{max-width:1100px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:1fr 360px;gap:18px}.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}.card,.cart{background:white;border:1px solid #e5e7eb;border-radius:14px;padding:15px}.card{cursor:pointer;text-align:left}.price{font-weight:800;color:#ea580c}.cart{height:max-content;position:sticky;top:90px}.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #eee}input,button{font:inherit}input{width:100%;padding:11px;box-sizing:border-box;border:1px solid #d1d5db;border-radius:9px;margin:5px 0 9px}button{border:0;border-radius:9px;padding:10px 13px;cursor:pointer}.primary{width:100%;background:#f97316;color:white;font-weight:700}.muted{color:#6b7280}@media(max-width:760px){.grid{grid-template-columns:1fr}.cart{position:static}.menu{grid-template-columns:1fr 1fr}}@media(max-width:420px){.menu{grid-template-columns:1fr}}</style></head><body><header><b id="brand">MK Pizza</b><div class="muted" id="sub">Online Ordering</div></header><main><div class="grid"><section><input id="search" placeholder="Search menu..."><div class="menu" id="menu"></div></section><aside class="cart"><h2>Your Order</h2><div id="cart"></div><p><b>Total: <span id="total">Rs. 0</span></b></p><label>Name<input id="name" placeholder="Your name"></label><label>Phone<input id="phone" placeholder="03xx-xxxxxxx"></label><label>Address<input id="address" placeholder="Delivery address or Pickup"></label><button class="primary" id="place">Place Order</button><p id="msg" class="muted"></p></aside></div></main><script>const API='';const menuId=new URLSearchParams(location.search).get('menu')||'default';let products=[],cart=[];const money=n=>'Rs. '+Number(n||0).toLocaleString();async function load(){const r=await fetch(API+'/api/menu/'+encodeURIComponent(menuId));const d=await r.json();products=(d.products||[]).filter(p=>p.active!==false&&!p.isDeal);document.title=(d.settings?.name||'Restaurant')+' — Order Online';document.querySelector('#brand').textContent=d.settings?.name||'Restaurant';render()}function render(){const q=document.querySelector('#search').value.toLowerCase();document.querySelector('#menu').innerHTML=products.filter(p=>(p.name+' '+(p.category||'')).toLowerCase().includes(q)).map(p=>'<button class="card" onclick="add(\''+p.id+'\')"><b>'+esc(p.name)+'</b><p class="muted">'+esc(p.category||'')+'</p><span class="price">'+money(p.price)+'</span></button>').join('');document.querySelector('#cart').innerHTML=cart.length?cart.map((i,n)=>'<div class="row"><span>'+i.qty+' × '+esc(i.name)+'</span><span>'+money(i.price*i.qty)+' <button onclick="removeItem('+n+')">×</button></span></div>').join(''):'<p class="muted">Your cart is empty.</p>';document.querySelector('#total').textContent=money(cart.reduce((a,i)=>a+i.price*i.qty,0))}function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function add(id){const p=products.find(x=>x.id===id);if(!p)return;const i=cart.find(x=>x.productId===id);i?i.qty++:cart.push({productId:p.id,name:p.name,price:Number(p.price),qty:1});render()}function removeItem(n){cart.splice(n,1);render()}document.querySelector('#search').oninput=render;document.querySelector('#place').onclick=async()=>{const customer={name:document.querySelector('#name').value.trim(),phone:document.querySelector('#phone').value.trim(),address:document.querySelector('#address').value.trim()};if(!customer.name||!customer.phone||!cart.length){document.querySelector('#msg').textContent='Please enter your name, phone and add items.';return}const total=cart.reduce((a,i)=>a+i.price*i.qty,0);const r=await fetch(API+'/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({menuId,customer,items:cart,total})});const d=await r.json();document.querySelector('#msg').textContent=d.ok?'Order '+d.orderId+' received. We will confirm it shortly.':(d.error||'Unable to place order.');if(d.ok){cart=[];render()}};load().catch(()=>document.querySelector('#msg').textContent='Online menu is temporarily unavailable.');</script></body></html>
